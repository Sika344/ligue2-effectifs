# .github/workflows/finishing.yml
# Régénère finishing.json (un enregistrement par tir) et le committe s'il a changé.
# Pré-requis : secrets de dépôt SB_USERNAME et SB_PASSWORD.
# Placer ce fichier dans .github/workflows/finishing.yml et build_finishing.py à la racine.

name: Build tirs Finishing

on:
  schedule:
    - cron: "30 6 * * *"       # tous les jours à 06:30 UTC (après teamindex)
  workflow_dispatch:
    inputs:
      season:
        description: "Saison au format 2026-2027 (vide = saison courante)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-finishing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install statsbombpy pandas
      - name: Generate finishing.json
        env:
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          SEASON: ${{ inputs.season }}
        run: python build_finishing.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain finishing*.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add finishing*.json
            git commit -m "chore: maj finishing.json (tirs)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              sleep $((RANDOM % 10 + 3))
            done
            echo "push impossible après 5 tentatives" >&2
            exit 1
          else
            echo "finishing.json inchangé."
          fi
