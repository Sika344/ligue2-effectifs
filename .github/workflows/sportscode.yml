# À déposer dans .github/workflows/sportscode.yml (PAS à la racine du repo).
# Attention à l'indentation de 2 espaces sous `on:` — sinon
# "No event triggers defined in `on:`".

name: build sportscode timelines

on:
  schedule:
    - cron: "15 5 * * *"     # 05:15 UTC, après xg/inposs/outposs
  workflow_dispatch:
    inputs:
      season:
        description: "Saison (ex. 2025-2026). Vide = saison courante."
        required: false
        default: ""
      force:
        description: "Régénérer tous les matchs (sinon incrémental)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet statsbombpy pandas

      - name: Build timelines
        env:
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          SEASON: ${{ github.event.inputs.season }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python build_sportscode.py $ARGS

      - name: Inspect output
        run: |
          echo "--- dossiers produits ---"
          for d in sc sc_*; do
            [ -d "$d" ] || continue
            echo "$d : $(find "$d" -type f | wc -l) fichier(s), $(du -sh "$d" | cut -f1)"
          done
          test -f sc/index.json || { echo "!! sc/index.json absent, rien à publier"; exit 1; }

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # NB : ajouter les dossiers un par un. `git add sc sc_*` échoue en bloc
          # quand le motif sc_* ne correspond à rien -> plus rien n'est ajouté.
          for d in sc sc_*; do
            [ -d "$d" ] && git add "$d"
          done
          echo "--- $(git diff --staged --name-only | wc -l) fichier(s) indexé(s) ---"
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -q -m "sportscode: maj des timelines [skip ci]"

          # Le job dure ~20 min : le dépôt a pu bouger entre-temps (dépôt manuel
          # de fichiers, autre Action). Un push direct serait rejeté "fetch first"
          # -> on rebase sur l'état distant et on retente.
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BR"; then
              echo "push OK (tentative $i)"
              exit 0
            fi
            echo "push rejeté (tentative $i) -> rebase sur origin/$BR"
            git fetch -q origin "$BR" || true
            git rebase "origin/$BR" || { echo "!! conflit de rebase"; exit 1; }
            sleep 5
          done
          echo "!! push impossible après 5 tentatives"
          exit 1
