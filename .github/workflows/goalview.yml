# .github/workflows/goalview.yml
# Régénère goalview.json (tirs cadrés concédés, vue gardien) et le committe s'il a changé.
# Pré-requis : secrets de dépôt SB_USERNAME et SB_PASSWORD.
# Placer ce fichier dans .github/workflows/goalview.yml et build_goalview.py à la racine.

name: Build goal view gardiens

on:
  schedule:
    - cron: "0 7 * * *"        # tous les jours à 07:00 UTC (après defending)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-goalview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install statsbombpy pandas
      - name: Generate goalview.json
        env:
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
        run: python build_goalview.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain goalview.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add goalview.json
            git commit -m "chore: maj goalview.json (tirs cadres concedes)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              sleep $((RANDOM % 10 + 3))
            done
            echo "push impossible apres 5 tentatives" >&2
            exit 1
          else
            echo "goalview.json inchange."
          fi
