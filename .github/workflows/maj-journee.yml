# À déposer dans .github/workflows/maj-journee.yml
#
# UN SEUL workflow qui régénère les 15 jeux de données du site après une
# journée de championnat, POUR CHAQUE COMPÉTITION, puis commite le tout en
# une fois.
#
# ATTENTION à l'ordre : build_effectif_stats.py écrit DANS ligue2_<saison>.json.
# Si tu relances un jour build_ligue2_lfp.py (rafraîchissement des photos et des
# effectifs), il réécrit ce fichier depuis la LFP et efface les statistiques —
# c'est exactement ce qui s'était produit et qui laissait 2026-2027 à zéro.
# Dans ce cas, relance ce workflow derrière pour les remettre.
#
# ------------------------------------------------------------ DEUX COMPÉTITIONS
# La boucle tourne sur COMPETITIONS (« 8 7 » = Ligue 2 puis Ligue 1). Chaque
# script lit COMP et en déduit son identifiant StatsBomb ET le préfixe de ses
# fichiers — voir competition.py.
#
#   COMP=8  ->  xg_2026-2027.json       (Ligue 2, nom historique inchangé)
#   COMP=7  ->  xg_L1_2026-2027.json    (Ligue 1)
#
# EN SÉRIE, PAS EN MATRICE. Une matrice ferait tourner deux jobs en parallèle,
# donc deux commits concurrents sur le même dépôt — exactement la collision de
# push que ce workflow avait été créé pour supprimer. Une boucle dans un seul
# job coûte du temps de calcul, qui est gratuit ici, et garantit un seul commit.
#
# COÛT : environ 1 h 25 par compétition, soit près de 3 h par passage et moins
# de 6 h par jour. Gratuit sur un dépôt public, et le timeout est à 300 min.
#
# ------------------------------------------------------------------ POURQUOI
# Les 13 workflows individuels ont chacun leur cron quotidien, mais ils ne
# mettaient JAMAIS à jour la saison en cours. Raison : sur un déclenchement
# `schedule`, GitHub n'applique pas les `default:` des inputs — `inputs.season`
# arrive vide. Les scripts retombaient alors sur leur CURRENT_SEASON codée en
# dur ("2025-2026") et écrivaient xg.json, pressing.json… SANS suffixe, or
# season.js ne lit que les fichiers suffixés. Des heures de calcul par semaine
# pour des fichiers que le site n'ouvre jamais.
#
# D'où le `|| env.SAISON_PAR_DEFAUT` ci-dessous : il couvre les deux cas, le
# lancement manuel avec champ laissé vide ET le lancement planifié.
#
# CES 13 WORKFLOWS SONT MAINTENANT NUISIBLES. Ils tournent sans COMP, donc en
# Ligue 2, et écrivent des fichiers nus que personne ne lit. Tant qu'il n'y
# avait qu'une compétition c'était du gaspillage ; avec deux, c'est une source
# de confusion au diagnostic. À désactiver.
#
# ---------------------------------------------------------------- POURQUOI 1 COMMIT
# Les scripts tournent en série et un seul commit clôt la course. Les push
# simultanés de 13 workflows se rejetaient mutuellement ("fetch first") ; ici
# le problème ne peut plus se poser. La boucle de rebase reste par sécurité,
# au cas où un ancien workflow pousserait pendant la course.
#
# ------------------------------------------------------------------ CHANGER LA SAISON
# En fin de saison, une seule ligne à modifier : SAISON_PAR_DEFAUT.

name: MAJ journée (tous les jeux de données)

on:
  schedule:
    # DEUX PASSAGES PAR JOUR, tous les jours.
    #
    # 02:00 UTC : rattrape les matchs du soir une fois ingérés dans la nuit.
    #   StatsBomb a publié la Ligue 1 2026/2027 à 02:12 et la Ligue 2 à 01:11
    #   le 27/11 — l'heure est donc bien placée, mais JUSTE : un passage à
    #   02:00 peut manquer l'ingestion Ligue 1 de quelques minutes. Le passage
    #   de 14:00 la rattrape le jour même.
    # 14:00 UTC : seconde chance de la journée. StatsBomb publie souvent avec
    #   plusieurs heures de retard.
    #
    # CE QUE ÇA NE CHANGE PAS : le facteur limitant reste l'ingestion par
    # StatsBomb, pas notre fréquence. Nantes et Laval ont mis trois semaines à
    # apparaître. Passer à deux fois par jour borne NOTRE retard à douze heures,
    # il ne raccourcit pas le leur.
    #
    # 02:00 et 14:00 évitent la plage 04:30–07:30 des 13 anciens workflows,
    # dont les push entreraient en collision avec le nôtre.
    - cron: "0 2,14 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Saison (vide = saison par défaut du workflow)"
        required: false
        default: ""
      competitions:
        description: "Compétitions : 8=Ligue 2, 7=Ligue 1. Vide = les deux."
        required: false
        default: ""
      sportscode:
        description: "Régénérer aussi les timelines SportsCode (+20 min par compétition)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: maj-journee
  cancel-in-progress: false

env:
  SAISON_PAR_DEFAUT: "2026-2027"
  COMPETITIONS_PAR_DEFAUT: "8 7"

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet statsbombpy pandas

      # competition.py est importé par les 17 scripts. Absent, ils échoueraient
      # tous les uns après les autres sur un ImportError illisible, après avoir
      # tenté de se connecter à StatsBomb. On s'arrête ici, tout de suite.
      - name: Vérifier competition.py
        run: |
          if [ ! -f competition.py ]; then
            echo "::error::competition.py absent de la racine du dépôt. Les scripts ne peuvent pas démarrer."
            exit 1
          fi
          COMP=7 python -c "import competition; assert competition.PREFIXE=='L1_', competition.PREFIXE"
          COMP=8 python -c "import competition; assert competition.PREFIXE=='',    repr(competition.PREFIXE)"
          echo "competition.py répond correctement pour les deux compétitions."

      - name: Paramètres retenus
        id: s
        run: |
          SAISON="${{ inputs.season }}"
          # bash tourne avec -e : « [ ... ] && cmd » renverrait 1 quand le test
          # est faux et ferait échouer l'étape. D'où le if/fi explicite.
          if [ -z "$SAISON" ]; then SAISON="${{ env.SAISON_PAR_DEFAUT }}"; fi
          COMPS="${{ inputs.competitions }}"
          if [ -z "$COMPS" ]; then COMPS="${{ env.COMPETITIONS_PAR_DEFAUT }}"; fi
          echo "saison=$SAISON" >> "$GITHUB_OUTPUT"
          echo "comps=$COMPS"   >> "$GITHUB_OUTPUT"
          echo "### Saison \`$SAISON\` — compétitions \`$COMPS\`" >> "$GITHUB_STEP_SUMMARY"

      # Chaque script est indépendant : si l'un échoue (API indisponible, match
      # non encore ingéré…), les autres doivent quand même produire leurs
      # données. On collecte donc les échecs sans interrompre la course, et on
      # ne fait échouer le job qu'à la toute fin, APRÈS le commit.
      #
      # Idem entre compétitions : si la Ligue 1 est en panne, la Ligue 2 doit
      # quand même être à jour le lendemain matin.
      - name: Régénérer les jeux de données
        id: build
        env:
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          SEASON: ${{ steps.s.outputs.saison }}
        run: |
          SCRIPTS="
          build_xg.py
          build_inposs.py
          build_outposs.py
          build_losses.py
          build_recoveries.py
          build_pressing.py
          build_buildup.py
          build_defending.py
          build_finishing.py
          build_shotmix.py
          build_goalview.py
          build_clubstats.py
          build_effectif_stats.py
          build_individual.py
          build_rapport.py
          "
          ECHECS=""
          echo "| Compétition | Script | Résultat | Durée |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for c in ${{ steps.s.outputs.comps }}; do
            if [ "$c" = "8" ]; then NOM="Ligue 2"; else NOM="Ligue 1"; fi
            echo "::group::=== $NOM (COMP=$c) ==="
            for s in $SCRIPTS; do
              if [ ! -f "$s" ]; then
                echo "::warning::$s absent du dépôt — ignoré"
                echo "| $NOM | \`$s\` | ⚠️ absent | — |" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              t0=$SECONDS
              if COMP="$c" python "$s"; then
                d=$((SECONDS - t0))
                echo "| $NOM | \`$s\` | ✅ | ${d}s |" >> "$GITHUB_STEP_SUMMARY"
              else
                d=$((SECONDS - t0))
                echo "::error::$s a échoué en $NOM"
                echo "| $NOM | \`$s\` | ❌ échec | ${d}s |" >> "$GITHUB_STEP_SUMMARY"
                ECHECS="$ECHECS $NOM/$s"
              fi
            done
            echo "::endgroup::"
          done
          echo "echecs=$ECHECS" >> "$GITHUB_OUTPUT"

      - name: Timelines SportsCode
        id: sc
        # Sur `schedule`, `inputs` est nul — et GitHub convertit null comme
        # false en 0, si bien que « inputs.sportscode != false » serait FAUX et
        # l'étape sautée. On teste donc l'événement explicitement.
        if: ${{ github.event_name == 'schedule' || inputs.sportscode }}
        continue-on-error: true
        env:
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          SEASON: ${{ steps.s.outputs.saison }}
        run: |
          if [ ! -f build_sportscode.py ]; then
            echo "::warning::build_sportscode.py absent — ignoré"
            exit 0
          fi
          for c in ${{ steps.s.outputs.comps }}; do
            echo "::group::sportscode COMP=$c"
            COMP="$c" python build_sportscode.py || echo "::warning::sportscode a échoué pour COMP=$c"
            echo "::endgroup::"
          done

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # individual*.json pèse ~2 Mo : il est bien couvert par le glob,
          # mais on le nomme ici pour mémoire, il est arrivé qu'on l'oublie.
          git add -- '*.json'
          # Un glob qui ne correspond à rien fait rejeter TOUTE la commande par
          # git : les dossiers sc* sont donc ajoutés un par un, après test.
          # sc_L1_* est couvert par sc_* — la Ligue 1 écrit dans sc_L1_<saison>/.
          for d in sc sc_*; do
            if [ -d "$d" ]; then git add -- "$d"; fi
          done

          if git diff --staged --quiet; then
            echo "Aucune donnée modifiée."
            echo "_Aucune donnée modifiée._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### Fichiers mis à jour" >> "$GITHUB_STEP_SUMMARY"
          git diff --staged --name-only | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

          git commit -q -m "chore: MAJ journée (${{ steps.s.outputs.saison }}, comp ${{ steps.s.outputs.comps }})"

          # Le rebase pouvait rester COINCÉ. Quand deux runs se suivent de près,
          # le second voit son push rejeté, tente un rebase qui bute sur un
          # conflit, et laisse le dépôt en plein rebase : les quatre tentatives
          # suivantes échouent alors toutes pour cette raison, et le run se
          # termine en rouge sans rien avoir enregistré. C'est ce qui est arrivé
          # au run #8 du 31/08 — une heure de calcul perdue.
          #
          # Ces fichiers sont des données REGÉNÉRÉES : en cas de conflit, notre
          # version est la bonne, elle vient d'être calculée. On abandonne donc
          # un rebase bloqué et on reprend simplement la main sur les fichiers
          # en conflit, au lieu d'attendre un arbitrage impossible.
          pousse=0
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push OK (tentative $i)"
              pousse=1
              break
            fi
            echo "push rejeté (tentative $i) — resynchronisation…"
            git rebase --abort 2>/dev/null || true
            if ! git pull --rebase --autostash origin main; then
              echo "conflit pendant le rebase : on garde nos fichiers régénérés"
              git checkout --theirs -- . 2>/dev/null || true
              git add -A
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
            sleep $((RANDOM % 5 + 2))
          done
          if [ "$pousse" != 1 ]; then
            echo "::error::push impossible après 5 tentatives — les données calculées n'ont PAS été enregistrées. Relancer le workflow."
            exit 1
          fi

      # Le commit est fait : on peut maintenant signaler les scripts en échec
      # sans avoir perdu le travail des autres.
      - name: Bilan
        run: |
          E="${{ steps.build.outputs.echecs }}"
          if [ -n "$E" ]; then
            echo "::error::scripts en échec :$E"
            exit 1
          fi
          echo "Tous les jeux de données sont à jour."
