<script src="season.js"></script>
<script>
"use strict";

/* ===========================================================================
   REGROUPEMENT DES POSTES
   StatsBomb renvoie 24 postes distincts, dont certains à 1 ou 2 joueurs sur la
   saison (Right Attacking Midfielder : 1). Un percentile calculé sur un groupe
   de 1 vaut toujours 50 et ne dit rien. On regroupe donc par famille, avec la
   possibilité de revenir au poste exact quand l'effectif le permet.
   =========================================================================== */
const GROUPES = [
  ["Gardien",              ["Goalkeeper"]],
  ["Défenseur central",    ["Centre Back","Left Centre Back","Right Centre Back"]],
  ["Latéral",              ["Left Back","Right Back","Left Wing Back","Right Wing Back"]],
  ["Milieu défensif",      ["Centre Defensive Midfielder","Left Defensive Midfielder","Right Defensive Midfielder"]],
  ["Milieu central",       ["Centre Midfielder","Left Centre Midfielder","Right Centre Midfielder"]],
  ["Milieu offensif",      ["Centre Attacking Midfielder","Left Attacking Midfielder","Right Attacking Midfielder"]],
  ["Ailier",               ["Left Wing","Right Wing","Left Midfielder","Right Midfielder"]],
  ["Attaquant",            ["Centre Forward","Left Centre Forward","Right Centre Forward","Secondary Striker"]]
];
const POSTE2GRP = {};
GROUPES.forEach(([g, l]) => l.forEach(p => POSTE2GRP[p] = g));

const COULEURS = ["#e2571f", "#0d3b8c", "#128a5a", "#8c2d8c"];

let DATA = null;                 // individual_<saison>.json
let SEL  = [];                   // joueurs choisis (max 4)
let MET  = [];                   // clés des métriques cochées
let SEUIL = 450;

const $ = id => document.getElementById(id);
const num = v => (v === null || v === undefined || v !== v) ? null : +v;

/* ---------------------------------------------------------------- percentile
   Rang moyen : un joueur strictement supérieur à 7 des 10 autres et à égalité
   avec 2 obtient (7 + 1) / 10. Sans ce demi-rang, plusieurs joueurs à égalité
   recevraient tous le percentile le plus bas de la plage — pénalisant à tort
   les métriques où beaucoup de joueurs valent exactement 0.                  */
function percentile(valeurs, v){
  if (!valeurs.length) return null;
  let inf = 0, eq = 0;
  for (const x of valeurs){ if (x < v) inf++; else if (x === v) eq++; }
  return 100 * (inf + eq / 2) / valeurs.length;
}
/* Valeur brute atteinte à un percentile donné — sert à graduer les anneaux. */
function valeurAuPct(triees, pct){
  if (!triees.length) return null;
  const i = (triees.length - 1) * pct / 100;
  const b = Math.floor(i), h = Math.ceil(i);
  return b === h ? triees[b] : triees[b] + (triees[h] - triees[b]) * (i - b);
}

function grpDe(p){ return POSTE2GRP[p.poste] || "Autre"; }

/* Population de référence : même famille (ou même poste exact) et temps de jeu
   suffisant. C'est elle qui fixe l'échelle de TOUS les axes. */
function reference(){
  const base = $("fBase").value, gsel = $("fPos").value;
  return DATA.players.filter(p => {
    if ((p.minutes || 0) < SEUIL) return false;
    if (gsel === "*") return true;
    return base === "exact" ? p.poste === gsel : grpDe(p) === gsel;
  });
}
/* Quand un joueur est comparé, sa référence suit SON poste, pas le filtre —
   sinon on comparerait un attaquant à des défenseurs centraux. */
function referenceDe(j){
  const base = $("fBase").value;
  return DATA.players.filter(p => (p.minutes || 0) >= SEUIL &&
    (base === "exact" ? p.poste === j.poste : grpDe(p) === grpDe(j)));
}

function fmt(v){
  if (v === null) return "—";
  const a = Math.abs(v);
  return a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : a >= 1 ? v.toFixed(2) : v.toFixed(3);
}

/* ------------------------------------------------------------------- radar */
function radar(){
  const host = $("radar");
  if (MET.length < 3){
    host.innerHTML = '<div class="empty">Coche au moins 3 métriques.</div>'; return;
  }
  if (!SEL.length){
    host.innerHTML = '<div class="empty">Ajoute un joueur pour tracer le radar.</div>'; return;
  }

  const W = 620, H = 620, cx = W/2, cy = H/2, R = 205;
  const n = MET.length, ANN = 5;
  const metas = MET.map(k => DATA.metrics.find(m => m.cle === k));

  // Échelle par axe : distribution de la référence du PREMIER joueur, pour que
  // les valeurs affichées sur les anneaux correspondent à un groupe unique.
  const ref = referenceDe(SEL[0]);
  const dist = {};
  metas.forEach(m => {
    const v = ref.map(p => num(p.vals[m.cle])).filter(x => x !== null).sort((a,b)=>a-b);
    dist[m.cle] = v;
  });

  const ang = i => (Math.PI * 2 * i / n) - Math.PI/2;
  const pt  = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];

  let g = '';
  // anneaux
  for (let a = 1; a <= ANN; a++){
    const r = R * a / ANN;
    const pts = [];
    for (let i = 0; i < n; i++){ const [x,y] = pt(i, r); pts.push(x.toFixed(1)+','+y.toFixed(1)); }
    g += '<polygon points="'+pts.join(' ')+'" fill="none" stroke="#e6e9ee" stroke-width="1"/>';
  }
  // axes + libellés + graduations en valeur brute
  metas.forEach((m, i) => {
    const [x2,y2] = pt(i, R);
    g += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#dfe3e9"/>';
    for (let a = 1; a <= ANN; a++){
      const v = valeurAuPct(dist[m.cle], a * 100 / ANN);
      if (v === null) continue;
      const [gx,gy] = pt(i, R * a / ANN);
      g += '<text x="'+gx.toFixed(1)+'" y="'+(gy-3).toFixed(1)+'" text-anchor="middle" '+
           'font-size="8.5" fill="#aab2bd">'+fmt(v)+'</text>';
    }
    const [lx,ly] = pt(i, R + 34);
    const anc = Math.abs(lx-cx) < 12 ? 'middle' : (lx > cx ? 'start' : 'end');
    g += '<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="'+anc+'" '+
         'font-size="11.5" font-weight="650" fill="#0a1733">'+m.label+'</text>';
  });
  // polygones joueurs
  SEL.forEach((j, k) => {
    const rj = referenceDe(j);
    const pts = [];
    metas.forEach((m, i) => {
      const vals = rj.map(p => num(p.vals[m.cle])).filter(x => x !== null);
      const v = num(j.vals[m.cle]);
      let p = v === null ? 0 : percentile(vals, v);
      if (m.sens < 0) p = 100 - p;              // fautes, cartons : moins = mieux
      const [x,y] = pt(i, R * Math.max(p,0) / 100);
      pts.push(x.toFixed(1)+','+y.toFixed(1));
    });
    const c = COULEURS[k % COULEURS.length];
    g += '<polygon points="'+pts.join(' ')+'" fill="'+c+'" fill-opacity="'+(SEL.length>1?0.13:0.20)+
         '" stroke="'+c+'" stroke-width="2.2" stroke-linejoin="round"/>';
  });

  host.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:640px">'+g+'</svg>';
}

/* ------------------------------------------------------------------ tableau */
function tableau(){
  const host = $("tbl");
  if (!SEL.length || MET.length < 3){ host.innerHTML = ''; return; }
  const metas = MET.map(k => DATA.metrics.find(m => m.cle === k));
  let h = '<table><thead><tr><th>Métrique</th>';
  SEL.forEach((j,k) => h += '<th colspan="2" style="text-align:center;color:'+COULEURS[k%4]+'">'+
                            j.nom+'</th>');
  h += '</tr><tr><th></th>';
  SEL.forEach(() => h += '<th>brut</th><th>pct</th>');
  h += '</tr></thead><tbody>';
  metas.forEach(m => {
    h += '<tr><td>'+m.label+(m.sens<0?' <span style="color:#aab2bd">↓</span>':'')+'</td>';
    SEL.forEach(j => {
      const rj = referenceDe(j);
      const vals = rj.map(p => num(p.vals[m.cle])).filter(x => x !== null);
      const v = num(j.vals[m.cle]);
      let p = v === null ? null : percentile(vals, v);
      if (p !== null && m.sens < 0) p = 100 - p;
      const col = p === null ? '#aab2bd' : p >= 70 ? '#128a5a' : p >= 40 ? '#8a7a12' : '#b33';
      h += '<td class="raw">'+fmt(v)+'</td><td class="pct" style="color:'+col+'">'+
           (p === null ? '—' : Math.round(p))+'</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  host.innerHTML = h;
}

/* -------------------------------------------------------------------- rendu */
function rendu(){
  const ref = reference();
  $("nRef").textContent = ref.length + " joueurs";
  let av = '';
  if (SEL.length){
    const petits = SEL.filter(j => referenceDe(j).length < 10);
    if (petits.length) av += "Groupe de comparaison trop mince pour "+
      petits.map(j=>j.nom).join(", ")+" : moins de 10 joueurs au même poste passent le seuil. "+
      "Les percentiles y sont peu fiables — baisse le seuil de minutes, ou repasse en groupe de poste.";
  }
  if ((DATA.season||"") === "2026-2027") av += (av?" ":"")+
    "Saison en cours : peu de journées jouées, les per 90 restent instables.";
  $("alerte").innerHTML = av ? '<div class="warn">'+av+'</div>' : '';

  radar(); tableau();
  $("note").innerHTML = "Chaque axe est gradué en <b>valeur réelle</b> ; la position du point est le "+
    "<b>rang percentile</b> du joueur parmi les joueurs de son poste ayant au moins "+SEUIL+" minutes. "+
    "Un axe marqué ↓ est inversé : fautes et cartons, moins il y en a, plus le percentile est haut. "+
    "Source : StatsBomb <code>player_season_stats</code>, saison "+(DATA.season||"")+".";
}

/* ------------------------------------------------------------- construction */
function majListeAjout(){
  const eq = $("fTeam").value, gsel = $("fPos").value, base = $("fBase").value;
  const dispo = DATA.players
    .filter(p => (p.minutes||0) >= SEUIL)
    .filter(p => eq === "*" || p.equipe === eq)
    .filter(p => gsel === "*" || (base === "exact" ? p.poste === gsel : grpDe(p) === gsel))
    .filter(p => !SEL.some(s => s.id === p.id))
    .sort((a,b) => String(a.nom).localeCompare(String(b.nom)));
  $("fAdd").innerHTML = '<option value="">Ajouter un joueur…</option>' +
    dispo.map(p => '<option value="'+p.id+'">'+p.nom+' — '+(p.equipe||'?')+
                   ' ('+Math.round(p.minutes||0)+' min)</option>').join('');
  $("fAdd").disabled = SEL.length >= 4;
}

function majChips(){
  $("chips").innerHTML = SEL.map((j,k) =>
    '<span class="chip"><span class="dot" style="background:'+COULEURS[k%4]+'"></span>'+
    j.nom+' <span class="sub">'+(j.equipe||'?')+' · '+(j.poste||'?')+' · '+
    Math.round(j.minutes||0)+' min</span>'+
    '<button data-i="'+k+'" title="Retirer">×</button></span>').join('');
  $("chips").querySelectorAll("button").forEach(b => b.onclick = () => {
    SEL.splice(+b.dataset.i, 1); majChips(); majListeAjout(); rendu();
  });
}

function construire(){
  /* Le curseur doit s'adapter à la saison. Un seuil fixe de 450 minutes vidait
     complètement la page en 2026-2027, où le maximum joué est de 204 minutes :
     aucun joueur ne passait le filtre, et le radar restait blanc sans dire
     pourquoi. Bornes et valeur de départ sont donc déduites des données —
     25 % du temps de jeu maximum, ce qui écarte les entrées en fin de match
     sans exclure les joueurs à temps partiel. */
  const maxMin = Math.max(...DATA.players.map(p => p.minutes || 0), 90);
  const pas = 15;
  const dep = Math.max(pas, Math.round(maxMin * 0.25 / pas) * pas);
  const el = $("fMin");
  el.max = Math.ceil(maxMin / pas) * pas;
  el.step = pas;
  el.value = dep;
  SEUIL = dep;
  $("fMinL").textContent = SEUIL + " min";

  // postes réellement présents, pour ne proposer que des groupes non vides
  const grpPresents = new Set(DATA.players.map(grpDe));
  const inconnus = [...new Set(DATA.players.map(p=>p.poste)
                     .filter(p => p && !POSTE2GRP[p]))];
  const sansPoste = DATA.players.filter(p => !p.poste).length;

  $("fPos").innerHTML = '<option value="*">Tous les postes</option>' +
    GROUPES.filter(([g]) => grpPresents.has(g))
           .map(([g]) => '<option value="'+g+'">'+g+'</option>').join('');

  const eqs = [...new Set(DATA.players.map(p => p.equipe).filter(Boolean))].sort();
  $("fTeam").innerHTML = '<option value="*">Tous les clubs</option>' +
    eqs.map(e => '<option value="'+e+'">'+e+'</option>').join('');

  $("mets").innerHTML = DATA.metrics.map(m =>
    '<label class="met"><input type="checkbox" value="'+m.cle+'">'+m.label+'</label>').join('');
  // sélection de départ : celle de la maquette
  ["obv_off","xg","box_touches","key_passes","obv_def","def_actions"].forEach(k => {
    const el = $("mets").querySelector('input[value="'+k+'"]');
    if (el){ el.checked = true; MET.push(k); }
  });
  $("mets").querySelectorAll("input").forEach(el => el.onchange = () => {
    if (el.checked && MET.length >= 8){ el.checked = false; return; }
    MET = [...$("mets").querySelectorAll("input:checked")].map(x => x.value);
    limiterMet(); rendu();
  });
  limiterMet();

  // Un joueur qu'aucun groupe ne réclame disparaîtrait des listes sans un mot :
  // on le signale plutôt que de le laisser manquer en silence.
  const avis = [];
  if (inconnus.length) avis.push("Postes hors nomenclature, regroupés dans « Autre » : <b>"+
    inconnus.join(", ")+"</b>.");
  if (sansPoste) avis.push("<b>"+sansPoste+"</b> joueur(s) sans poste renseigné par StatsBomb — "+
    "visibles uniquement avec « Tous les postes ».");
  if (avis.length){
    const d = document.createElement("div");
    d.className = "note";
    d.style.marginTop = "8px";
    d.innerHTML = avis.join(" ");
    $("mets").parentNode.appendChild(d);
  }
}
/* À 8 métriques cochées, on grise les autres au lieu de les laisser cliquer
   pour rien : sans cela, un clic sans effet passe pour un bug. */
function limiterMet(){
  const plein = MET.length >= 8;
  $("mets").querySelectorAll(".met").forEach(l => {
    const i = l.querySelector("input");
    const off = plein && !i.checked;
    l.classList.toggle("off", off);
    i.disabled = off;
  });
}

/* -------------------------------------------------------------- événements */
function brancher(){
  $("fMin").oninput = () => {
    SEUIL = +$("fMin").value;
    $("fMinL").textContent = SEUIL + " min";
    majListeAjout(); rendu();
  };
  ["fPos","fBase","fTeam"].forEach(id => $(id).onchange = () => {
    if (id === "fBase"){
      // le sélecteur de poste change de nature : on le reconstruit
      const base = $("fBase").value;
      if (base === "exact"){
        const postes = [...new Set(DATA.players.map(p=>p.poste).filter(Boolean))].sort();
        $("fPos").innerHTML = '<option value="*">Tous les postes</option>' +
          postes.map(p => '<option value="'+p+'">'+p+'</option>').join('');
      } else {
        const grpPresents = new Set(DATA.players.map(grpDe));
        $("fPos").innerHTML = '<option value="*">Tous les postes</option>' +
          GROUPES.filter(([g]) => grpPresents.has(g))
                 .map(([g]) => '<option value="'+g+'">'+g+'</option>').join('');
      }
    }
    majListeAjout(); rendu();
  });
  $("fAdd").onchange = () => {
    const id = $("fAdd").value;
    if (!id) return;
    const j = DATA.players.find(p => String(p.id) === String(id));
    if (j && SEL.length < 4 && !SEL.some(s => s.id === j.id)) SEL.push(j);
    majChips(); majListeAjout(); rendu();
  };
}

/* ---------------------------------------------------------------- démarrage */
fetch(SEASON.fichier("individual.json") + "?_=" + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (!d || !d.players || !d.players.length){
      document.querySelector(".wrap").innerHTML =
        '<div class="empty">' + SEASON.absent("individual.json") + '</div>';
      return;
    }
    DATA = d;
    construire(); brancher(); majListeAjout(); majChips(); rendu();
  })
  .catch(() => {
    document.querySelector(".wrap").innerHTML =
      '<div class="empty">Impossible de charger les données joueur.</div>';
  });
</script>
</body>
</html>
